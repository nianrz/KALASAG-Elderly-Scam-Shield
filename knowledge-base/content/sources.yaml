# Provenance semantics
# retrieved_at means "the date the content backing this source was
# obtained" — this can be a web-page fetch, a dataset download, or (when
# noted explicitly on the source) corpus evidence standing in for a page
# that could not be fetched. It does not, by itself, promise a scraped
# advisories/<source_id>.md file exists.
# fetch_log.json is narrower: it records web-fetch attempts and outcomes
# for advisory page sources specifically (ok / ok-browser / empty / failed).
# When a source's retrieved_at is not backed by an "ok"/"ok-browser" entry
# in fetch_log.json, its notes field explains the non-web-fetch provenance.
- source_id: scottleechua-ph-sms
  name: PH Spam and Marketing SMS (with timestamps)
  organisation: Scott Lee Chua
  url: https://github.com/scottleechua/data/tree/main/spam-and-marketing-sms
  retrieved_at: '2026-08-06'
  licence: CC BY 4.0
  attribution: Chua, Scott Lee. "Spam and marketing SMS with timestamps." Available at https://github.com/scottleechua/data.
    Licensed under CC BY 4.0.
  notes: >-
    retrieved_at is the CSV dataset download date (kb.dataset.fetch_dataset
    pulling text-messages.csv), not a web-page fetch — this source is not
    tracked in fetch_log.json, which covers advisory page fetches only.
    8,255 messages; 1,907 with usable text after the author's privacy
    redaction. OTP and notifs are effectively fully redacted.
